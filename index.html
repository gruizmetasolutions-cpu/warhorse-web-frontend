        <main>
          <h2>Corporate Structure &amp; Binational Terminals</h2>
          <p>WARHORSE operates as an integrated 5PL transportation network combining three entities:</p>
          <ul>
            <li><strong>Warhorse Brokerage LLC</strong>: Core 5PL control tower and freight brokerage coordinating over 1,000 vetted network carriers.</li>
            <li><strong>Warhorse Transportation LLC</strong>: FMCSA certified U.S. asset-based motor carrier headquartered in Santa Teresa, New Mexico with 100+ tractors, dry vans, flatbeds, and reefers.</li>
            <li><strong>Warhorse México</strong>: CTPAT certified Mexican carrier based in Ciudad Juárez, Chihuahua with 200+ power units and dedicated cross-border drayage transfers.</li>
          </ul>

          <h2>Core Freight &amp; Supply Chain Services</h2>
          <ul>
            <li><strong>Full Truckload (FTL) &amp; LTL Consolidation</strong>: Seamless dry van freight throughout North America.</li>
            <li><strong>Cross-Border Drayage &amp; Transfers</strong>: Direct border crossings through Santa Teresa, NM and Ciudad Juárez, CHIH.</li>
            <li><strong>Specialized Flatbed &amp; Heavy Haul</strong>: 48' and 53' step-decks, lowboys, and machinery hauling.</li>
            <li><strong>Temperature-Controlled (Reefer)</strong>: Cold-chain transportation with 24/7 Samsara remote temperature monitoring.</li>
            <li><strong>5PL Supply Chain Outsourcing</strong>: Dedicated fleet management, cross-docking, and warehousing.</li>
          </ul>
